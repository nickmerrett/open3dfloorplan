apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open3dfloorplan-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: open3dfloorplan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open3dfloorplan
  template:
    metadata:
      labels:
        app: open3dfloorplan
    spec:
      containers:
        - name: open3dfloorplan
          image: open3dfloorplan:latest  # push to a registry and update this
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: PORT
              value: "5173"
            - name: DB_PATH
              value: "/app/data/projects.db"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open3dfloorplan-data

---

apiVersion: v1
kind: Service
metadata:
  name: open3dfloorplan
spec:
  selector:
    app: open3dfloorplan
  ports:
    - port: 80
      targetPort: 5173
  type: ClusterIP
